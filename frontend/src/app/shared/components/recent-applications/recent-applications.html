<div class="card mb-8!">
    <div class="font-semibold text-xl mb-4">Recent Sales</div>
    <p-table [value]="applications()" [paginator]="true" [rows]="5" responsiveLayout="scroll">
        <ng-template #header>
            <tr>
                <th>№</th>
                <th pSortableColumn="name">Name
                    <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th pSortableColumn="price">Job
                    <p-sortIcon field="price"></p-sortIcon>
                </th>
                <th>Status</th>
            </tr>
        </ng-template>
        <ng-template #body let-application>
            <tr>
                <td>
                    {{ application.id }}
                </td>
                <td>
                    {{ application.student }}
                </td>
                <td>
                    {{ application.jobName }}
                </td>
                <td>
                      {{ application.status }}
                </td>

            </tr>
        </ng-template>
    </p-table>
</div>
