<p-card>
    <div class="flex justify-between">

        <p-button [pTooltip]="'Create job'" (click)="openDialog()"><i class="pi pi-plus"></i></p-button>
        <div class="mb-10 mr-10">
            <p-iconfield iconPosition="left">
                <p-inputicon>
                    <i class="pi pi-search"></i>
                </p-inputicon>
                <input pInputText pSize="small" type="text"
                       (input)="dt1.filterGlobal($any($event.target).value, 'contains')" placeholder="Keyword Search"/>
            </p-iconfield>
        </div>
    </div>
    <p-table
        [value]="jobs()"
        #dt1
        [paginator]="'true'" [rows]="12"
        [globalFilterFields]="['title','description','minGpa','deadline','minExperience']"
    >
        <ng-template #header>
            <tr>
                <th>
                    №
                </th>
                <th>
                    title
                </th>
                <th>
                    description
                </th>
                <th>
                    minGpa
                </th>
                <th>
                    deadline
                </th>
                <th>
                    minExperience
                </th>
                <th>
                    status
                </th>
                <th>
                    Actions
                </th>
            </tr>
        </ng-template>

        <ng-template #body let-job let-rowIndex="rowIndex">
            <tr>
                <td>
                    {{ rowIndex + 1 }}
                </td>
                <td>
                    {{ job.title }}
                </td>
                <td>
                    {{ job.description }}
                </td>
                <td>
                    {{ job.minGpa }}
                </td>
                <td>
                    {{ job.deadline | date:'dd-MM-yy hh-mm-ss' }}
                </td>
                <td>
                    {{ job.minExperience }}
                </td>
                <td><p-tag [severity]="getJobStatus(job.isActive).type"> {{getJobStatus(job.isActive).label}}</p-tag>
                </td>
                <td>
                    <div class="flex gap-1">
                        <p-button [pTooltip]="'View detail'" [tooltipPosition]="'top'" severity="primary"
                                  variant="outlined" size="small"><i class="pi pi-eye"></i></p-button>
                        <p-button [pTooltip]="'Edit'" [tooltipPosition]="'top'" severity="primary" variant="outlined"
                                  size="small"><i class="pi pi-pencil"></i></p-button>
                        <p-button [pTooltip]="'Delete'"  (onClick)="deleteJob(job.id,$event)" [tooltipPosition]="'top'" severity="danger" variant="outlined"
                                  size="small"><i class="pi pi-trash"></i></p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</p-card>


<p-dialog
    [visible]='visible()'
    [modal]="true"
    class="w-100!"
    [style]="{width:'400px'}"
    [header]="'Create a job'"
>

    <div class="w-full">
        <form (ngSubmit)="createJob()">
            <div class="w-full mb-3 ">
                <label class="block mb-2 font-medium">
                    Job Title
                </label>

                <input
                    pInputText
                    [field]="jobForm.title"
                    class="w-full"
                    placeholder="Frontend Developer"
                />
            </div>

            <div class="col-12 mb-3">
                <label class="block mb-2 font-medium">
                    Description
                </label>

                <textarea
                    pTextarea
                    [field]="jobForm.description"
                    rows="3"
                    class="w-full"
                    placeholder="Job description..."
                ></textarea>
            </div>

            <div class="col-12 mb-3 md:col-6">
                <label class="block mb-2 font-medium">
                    Minimum GPA
                </label>

                <p-inputNumber
                    [field]="jobForm.minGpa"
                    [min]="0"
                    [max]="4"
                    [minFractionDigits]="1"
                    [maxFractionDigits]="2"
                    class="w-full"
                />
            </div>


            <div class="col-12 mb-3 md:col-6">
                <label class="block mb-2 font-medium">
                    Minimum Experience
                </label>

                <p-inputNumber
                    [field]="jobForm.minExperience"
                    [min]="0"
                    suffix=" months"
                    class="w-full"
                />
            </div>

            <div class="col-12">
                <label class="block mb-2 font-medium">
                    Application Deadline
                </label>

                <p-datepicker
                    [field]="jobForm.deadline"
                    [showIcon]="true"
                    [minDate]="today"
                    fluid
                    dateFormat="yy-mm-dd"
                    class="w-full"
                    styleClass="w-full"></p-datepicker>
            </div>


            <div class="">

                <div class="flex items-center justify-between mt-2 mb-2">

                    <label class="font-medium">
                        Required Skills
                    </label>

                    <p-button
                        type="button"
                        icon="pi pi-plus"
                        label="Add Skill"
                        size="small"
                        [text]="true"
                        (onClick)="addSkill()"
                    />

                </div>

                @for (skill of jobModel().skills; track $index) {

                    <div class="flex items-center gap-2 mb-2">

                        <p-select
                            [options]="skillsOptions()"
                            optionLabel="name"
                            optionValue="id"
                            [field]="jobForm.skills[$index].skillId"
                            placeholder="Select skill"
                            class="flex-1"
                        />

                        <p-inputNumber
                            [field]="jobForm.skills[$index].requiredLevel"
                            [min]="1"
                            [max]="5"
                            placeholder="Level"
                            styleClass="w-6rem"
                        />

                        <p-button
                            type="button"
                            icon="pi pi-trash"
                            severity="danger"
                            [text]="true"
                            [rounded]="true"
                            (onClick)="removeSkill($index)"
                        />

                    </div>
                }
            </div>

            <div
                class="flex justify-end gap-2 border-top-1 pt-3 mt-3">

                <p-button
                    type="button"
                    label="Cancel"
                    severity="secondary"
                    [outlined]="true"
                    (onClick)="closeDialog()"
                />

                <p-button
                    type="submit"
                    label="Create Job"
                    icon="pi pi-plus"
                    [loading]="loading()"
                    [disabled]="jobForm().invalid()"
                />
            </div>
        </form>
    </div>
</p-dialog>

<p-toast/>
<p-confirmdialog />
